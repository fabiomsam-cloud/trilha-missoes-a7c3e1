<script>
/* Link exclusivo da Ficha de Formação (POLICIAS) — usado no disparo.
   Quem conclui fica identificado também na Trilha de Missões (mesmo localStorage). */
(function () {
  var FRENTE = "POLICIAS", STORE = "trilha_" + FRENTE.toLowerCase(), GRUPO = "https://sndflw.com/i/fRiCa8jorZXLuQq20ywu";
  var box = document.getElementById("fx"), saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
  var me = saved && saved.tel ? { tel: saved.tel, nome: saved.nome || "" } : null;

  function depois(membro) {
    var card = box.querySelector(".fx-ok"); if (!card) return;
    card.insertAdjacentHTML("beforeend",
      '<a class="btn ghost" href="../" style="text-decoration:none;margin-top:12px">Continuar para as missões da trilha →</a>' +
      (membro === false ? '<a class="btn wa" href="' + GRUPO + '" target="_blank" rel="noopener" style="text-decoration:none;margin-top:10px">Entrar no grupo</a>' : ""));
  }
  function montar() {
    Ficha.mount(box, { frente: FRENTE, me: me, origem: "link", assetsBase: "../../assets/",
      onDone: function (r) {
        try { localStorage.setItem(STORE, JSON.stringify({ tel: r.participante.tel, nome: r.participante.nome })); } catch (e) {}
        depois(r.participante.membro);
      } });
  }
  if (!me) { montar(); return; }
  fetch("https://dqpxugdhlgafvddavzzp.supabase.co/functions/v1/missoes?op=ficha&frente=" + FRENTE + "&tel=" + me.tel)
    .then(function (x) { return x.json(); })
    .then(function (r) {
      if (r.feita && r.planner) { var h = Ficha.mount(box, { frente: FRENTE, me: me, origem: "link", assetsBase: "../../assets/" }); h.entregue(r.planner); depois(null); }
      else montar();
    }).catch(montar);
})();
</script>
